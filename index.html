<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="loginContainer">
    <label for="username">username:</label>
    <input type="text" id="username" placeholder="enter your username"><br><br>
    <label for="password">password:</label>
    <input type="password" id="password" placeholder="enter your password"><br><br>

    <button id="loginBtn">log in</button><br><br>
    <button id="myBtn">Show password</button>
    <p id="message"></p>
    </div>

    <div id="gameContainer">
        <h1>TIC TAC TOE</h1>
        <div id="cellContainer">
            <div cellIndex="0" class="cell"></div>
            <div cellIndex="1" class="cell"></div>
            <div cellIndex="2" class="cell"></div>
            <div cellIndex="3" class="cell"></div>
            <div cellIndex="4" class="cell"></div>
            <div cellIndex="5" class="cell"></div>
            <div cellIndex="6" class="cell"></div>
            <div cellIndex="7" class="cell"></div>
            <div cellIndex="8" class="cell"></div>
        </div>
        <h2 id="statusText"></h2>
        <button id="restartBtn">RESTART</button>
    </div>
    <script src="index.js"></script>
</body>

</html>
